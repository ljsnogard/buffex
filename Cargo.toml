[package]
name = "buffex"
version = "0.3.0"
edition = "2024"

authors = ["lino <lino_snsalias@outlook.com>"]
description = "BUFFer EXtensions: ring buffer and buffer chaining."
repository = "https://github.com/ljsnogard/buffex"
keywords = ["buffer", "io"]
categories = ["algorithms", "no-std"]
license = "MIT/Apache-2.0"
readme = "README.md"

[dependencies]
# -- core (async-runtime agnostic, no_std) --
atomex = { git = "https://gitee.com/lino_snsalias/atomex-rs.git", branch = "dev/0.1.2" }
abs_buff = { git = "https://gitee.com/lino_snsalias/abs_buff.git", branch = "dev/0.3.0" }

# -- optional async-framework trait adapters ------------------------------
# The core ring buffer never depends on any async runtime. These features
# only add `AsyncRead`/`AsyncWrite` trait implementations for the selected
# framework on top of the same core logic.
compio = { version = "0.19.*", optional = true, features = ["fs", "macros", "time", "net"] }
tokio = { version = "1", optional = true, features = ["io-util"] }
futures-io = { version = "0.3", optional = true }

[features]
default = ["compio"]

# Support `compio::io::AsyncRead` / `compio::io::AsyncWrite` (default).
compio = ["dep:compio"]

# Support `tokio::io::AsyncRead` / `tokio::io::AsyncWrite`.
tokio = ["dep:tokio"]

# Support `futures_io::AsyncRead` / `futures_io::AsyncWrite` (smol & friends).
smol = ["dep:futures-io"]

[[bench]]
name = "unix_stream_bandwidth"
harness = false
# required-features = ["compio"]

[dev-dependencies]
env_logger = { version = "0.11.*" }
log = { version = "0.4.*" }
rand = { version = "0.8.*" }
futures-lite = { version = "2" }
