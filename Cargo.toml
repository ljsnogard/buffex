[package]
name = "buffex"
version = "0.0.1"
edition = "2021"

authors = ["lino <lino_snsalias@outlook.com>"]
description = "BUFFer EXtensions: ring buffer and buffer chaining."
homepage = "https://github.com/ljsnogard/buffex"
keywords = ["buffer"]
categories = ["algorithms", "no-std"]
license = "MIT/Apache-2.0"
readme = "README.md"

[dependencies]
abs_buff = { git = "https://github.com/ljsnogard/abs_buff.git", branch = "dev-0.2.0" }
asyncex-channel = { git = "https://github.com/ljsnogard/asyncex-channel.git", tag = "0.0.1" }

pin-project = { version = "1.1.*" }
smallvec = { version = "1.13", features = [] }

[dev-dependencies]
mm_ptr = { git = "https://github.com/ljsnogard/mm_ptr.git", tag = "0.1.1" }
core_malloc = { git = "https://github.com/ljsnogard/core_malloc.git", tag = "0.1.1" }
abs_buff_chunk_utils = { git = "https://github.com/ljsnogard/abs_buff_chunk_utils.git", branch = "dev-0.2.0" }

env_logger = { version = "0.11.*" }
log = { version = "0.4.*" }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4.*" }
rand = { version = "0.8.*" }
