[package]
name = "buffex"
version = "0.0.1"
edition = "2021"

authors = ["lino <lino_snsalias@outlook.com>"]
description = "BUFFer EXtensions: ring buffer and buffer chaining."
homepage = "https://github.com/ljsnogard/buffex"
keywords = ["buffer"]
categories = ["algorithms", "no-std"]
license = "MIT/Apache-2.0"
readme = "README.md"

[dependencies]
abs_buff = { path = "../abs_buff" }
asyncex = { path = "../asyncex" }
mm_ptr = { path = "../mm_ptr" }

smallvec = { version = "1.13", features = [] }
pin-project = { version = "1.1.*" }

[dev-dependencies]
core_malloc = { version = "0.1" }
abs_buff_chunk_utils = { path = "../abs_buff_chunk_utils" }
env_logger = { version = "0.11.*" }
log = { version = "0.4.*" }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4.*" }
rand = { version = "0.8.*" }
