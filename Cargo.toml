[package]
name = "buffex"
version = "0.3.0"
edition = "2024"

authors = ["lino <lino_snsalias@outlook.com>"]
description = "BUFFer EXtensions: ring buffer and buffer chaining."
repository = "https://github.com/ljsnogard/buffex"
keywords = ["buffer", "io"]
categories = ["algorithms", "no-std"]
license = "MIT/Apache-2.0"

[dependencies]
abs_async_iter = { git = "https://gitee.com/lino_snsalias/abs_async_iter.git" }
abs_buff = { git = "https://gitee.com/lino_snsalias/abs_buff.git", branch = "dev/0.3.0" }
atomic_sync = { git = "https://gitee.com/lino_snsalias/atomic_sync.git", branch = "dev/0.3.0" }
mm_ptr = { git = "https://gitee.com/lino_snsalias/mm_ptr.git", branch = "dev/0.1.3" }

futures-lite = "2.6.1"

[dev-dependencies]
abs_buff-testkit = { git = "https://gitee.com/lino_snsalias/abs_buff-testkit.git" }

# 性能基准：`divan` 与 asyncband 官方 benchmark 同款；`asyncband` 只作为对标基线
# （其 mpsc bounded 同时充当 SPSC 的单生产者基线，因为 asyncband 没有 SPSC 实现）。
asyncband = { version = "0.7.2", features = ["mpsc"] }
divan = "0.1.21"

# 跨异步运行时的抽象层与两个具体后端（**不引 bridge**：bridge 用 Cargo feature
# 强制「只能有一个后端」，会让「同一次 cargo test 里跑两种后端」直接编译失败）。
abs_art = { git = "https://gitee.com/lino_snsalias/abs_art.git", branch = "dev/0.3.0", package = "abs_art" }
abs_art-tokio = { git = "https://gitee.com/lino_snsalias/abs_art.git", branch = "dev/0.3.0" }
abs_art-compio = { git = "https://gitee.com/lino_snsalias/abs_art.git", branch = "dev/0.3.0" }

env_logger = { version = "0.11.*" }
log = { version = "0.4.*" }
rand = { version = "0.10.*" }
tokio = { version = "1", features = ["full"] }
futures-lite = { version = "2" }
# 单线程异步运行时测试环境：验证 circular_buff 的同步泵（block_on）在
# 不同单线程运行时（tokio current_thread / compio / futures-executor）内
# 驱动主动端设备时能否正常运行。
compio = { version = "0.19.*", features = ["fs", "macros", "time"] }
futures-executor = "0.3"
futures-util = "0.3"

# 性能基准入口：divan 自带 main（`harness = false`），`test = false` 避免
# `cargo test` 顺手把基准跑一遍。
[[bench]]
name = "channels"
path = "benches/channels/main.rs"
harness = false
test = false
